services:
  db:
    image: postgres:17-alpine
    container_name: trackinternships-db
    environment:
      POSTGRES_USER: intern
      POSTGRES_PASSWORD: intern
      POSTGRES_DB: internships
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intern -d internships"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
