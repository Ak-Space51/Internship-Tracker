[project]
name = "scraper"
version = "0.1.0"
description = "TrackInternships ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
]

[project.scripts]
scraper = "scraper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]
