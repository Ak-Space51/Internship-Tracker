name: Ingest internships

on:
  schedule:
    # Every 6 hours, offset from :00 — GitHub queues scheduled jobs globally and
    # drops top-of-hour runs first under load. Missed slots are not backfilled.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run scraper migrate

      - name: Ingest all boards
        run: uv run scraper ingest

      - name: LLM classification fallback
        # secrets context is not allowed in step `if`; check the job-level env instead
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: uv run scraper classify

      - name: Send alert digests
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: uv run scraper alerts

      - name: Stats
        run: uv run scraper stats
